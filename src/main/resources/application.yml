# ============================================================
# CONFIGURACIÓN DE LOGS
# ============================================================
logging:
  level:
    com.monitor.invoices: INFO
    org.springframework.jdbc: WARN
    org.springframework.mail: INFO
  file:
    name: logs/invoice-monitor.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
